sonar.projectKey=NIKK-666_CyberForge
sonar.organization=nikk-666

# Only scan the real product code
sonar.sources=cognishield

# Exclude the deliberately vulnerable demo fixtures and attack payloads —
# these exist on purpose to demonstrate the attack CogniShield detects.
sonar.exclusions=vendor/**,demo/**,.github/workflows/ci.yml,node_modules/**,tests/**

# Don't fail the quality gate on test code either
sonar.tests=tests
